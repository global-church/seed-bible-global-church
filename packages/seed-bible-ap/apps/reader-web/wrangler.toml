# reader-web on the faithnet estate — a Worker in front of static assets (the same shape as bible.faithnet.io).
# The Worker renders a chapter URL on the edge (worker/index.ts); every other path is the asset the build emitted.
# Build FIRST (`pnpm deploy:faithnet` does): a bare `wrangler deploy` ships whatever stale dist/ holds.
name = "seed-bible-reader-web"
main = "worker/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every path: a chapter address starts with its language (/en/BSB/genesis/1), so the Worker must see them all; it
# hands anything that is not a chapter, a shared page, the sitemap or robots straight to the asset.
run_worker_first = true

[env.faithnet]
name = "seed-bible-reader-web-faithnet"
workers_dev = true

[env.faithnet.vars]
A2A_BASE = "https://seed-reader-a2a.faithnet.io"

[[env.faithnet.routes]]
pattern = "seed-reader.faithnet.io"
custom_domain = true

[env.faithnet.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every path: a chapter address starts with its language (/en/BSB/genesis/1), so the Worker must see them all; it
# hands anything that is not a chapter, a shared page, the sitemap or robots straight to the asset.
run_worker_first = true

# THE FAMILIAR-FIRST FORK (global-church/seed-bible-global-church, branch familiar-first): reader-web alone, on
# Global.Church's Cloudflare account at seed-bible.global-church.workers.dev, using the faithnet estate's reader
# agent as it is. Pinned to GC's account and given no route, so it can never replace seed-reader.faithnet.io.
# Deploy with `pnpm deploy:familiar`, never `--env faithnet` from this fork.
[env.familiar]
name = "seed-bible"
account_id = "e53893130a2674f4c12faeace7d15d83"
workers_dev = true

[env.familiar.vars]
A2A_BASE = "https://seed-reader-a2a.faithnet.io"

[env.familiar.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every path: a chapter address starts with its language (/en/BSB/genesis/1), so the Worker must see them all; it
# hands anything that is not a chapter, a shared page, the sitemap or robots straight to the asset.
run_worker_first = true
